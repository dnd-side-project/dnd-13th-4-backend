plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '7.2.1'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // spring boot starters
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Database
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'

    // swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'

    // test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Querydsl
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // firebase
    implementation 'com.google.firebase:firebase-admin:9.4.1'
}

test {
    useJUnitPlatform()
}

jar {
    enabled = false
}

spotless {
    format 'misc', {
        target '**/*.gradle', '**/*.md'
        trimTrailingWhitespace()
        indentWithSpaces(4)
        endWithNewline()
    }

    java {
        removeUnusedImports()
        palantirJavaFormat()
        formatAnnotations()
    }

    yaml {
        target '**/*.yml'
        prettier()
    }
}

tasks.register('autoInstallHooks') {
    onlyIf {
        def hookFile = new File(rootProject.rootDir, '.git/hooks/pre-commit')
        !hookFile.exists()
    }
    dependsOn 'addGitHooks'
}

tasks.register('addGitHooks', Copy) {
    from(new File(rootProject.rootDir, '.script/pre-commit'))
    into(new File(rootProject.rootDir, '.git/hooks'))
    eachFile { fileCopyDetails ->
        fileCopyDetails.mode = 0755
    }
    onlyIf {
        def gitDir = new File(rootProject.rootDir, '.git')
        gitDir.exists() && gitDir.isDirectory()
    }
}

tasks.named('compileJava') {
    dependsOn 'spotlessApply'
    dependsOn 'autoInstallHooks'
}

tasks.named('test') {
    useJUnitPlatform()
}
